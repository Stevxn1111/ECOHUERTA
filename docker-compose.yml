services:
  db:
    image: mariadb:11.4
    container_name: ecohuerta-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-ecohuerta}
      MARIADB_USER: ${DB_USER:-eco_user}
      MARIADB_PASSWORD: ${DB_PASS:-ecohuerta123}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootecohuerta123}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - ecohuerta_db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecohuerta-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ecohuerta}
      DB_USER: ${DB_USER:-eco_user}
      DB_PASS: ${DB_PASS:-ecohuerta123}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  ecohuerta_db_data:
  